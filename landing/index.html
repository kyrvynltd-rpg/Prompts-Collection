<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt Learning Platform</title>
  <meta name="description" content="Learn prompting fundamentals with guided examples, best practices, and instant prompt improvement feedback." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Prompt Learning Platform" />
  <meta property="og:description" content="Learn prompting fundamentals with guided examples, best practices, and instant prompt improvement feedback." />
  <meta property="og:url" content="https://prompt-learning-platform.onrender.com/" />
  <meta property="og:image" content="https://raw.githubusercontent.com/GIL794/Prompts-Collection/main/assets/logo.svg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Prompt Learning Platform" />
  <meta name="twitter:description" content="Learn prompting fundamentals with guided examples, best practices, and instant prompt improvement feedback." />
  <meta name="twitter:image" content="https://raw.githubusercontent.com/GIL794/Prompts-Collection/main/assets/logo.svg" />

  <meta http-equiv="refresh" content="2;url=https://prompt-learning-platform.onrender.com/" />
  <style>
    :root {
      --ink: #0f172a;
      --muted: #475569;
      --bg: #f8fafc;
      --card: #ffffff;
      --accent: #0f766e;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 600px at 20% -10%, #dbeafe 0%, transparent 60%), var(--bg);
      color: var(--ink);
      font: 16px/1.5 "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      width: min(640px, 92vw);
      background: var(--card);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      color: var(--ink);
    }
    p {
      margin: 0 0 14px;
      color: var(--muted);
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
    .copyright {
      margin-top: 10px;
      font-size: 0.84rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../assets/logo.svg" alt="Prompt Learning Platform logo" />
    <h1>Prompt Learning Platform</h1>
    <p>Redirecting you to the live app...</p>
    <p><a href="https://prompt-learning-platform.onrender.com/">Open the platform now</a></p>
    <p class="copyright">Copyright &copy; 2026 Kyrvyn Ltd. All rights reserved. Intellectual property of Kyrvyn Ltd. Registered in England and Wales, company number 17246800, registered office Office 15 Exning Road, E16 4NB. <a href="https://kyrvynltd.co.uk">kyrvynltd.co.uk</a></p>
  </main>
</body>
</html>
