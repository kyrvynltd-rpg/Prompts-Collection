# Render blueprint. Deliberately conservative: free plan and manual deploys,
# so merging code never triggers a deployment or a charge by itself.
services:
  - type: web
    name: prompts-collection
    env: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: ENTITLEMENT_SECRET
        sync: false   # set in the Render dashboard, never in git
  # Payment webhook receiver (stdlib HTTP service). Streamlit cannot receive webhooks, so this runs beside it.
  - type: web
    name: prompts-collection-webhooks
    env: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt -r requirements-postgres.txt
    startCommand: python src/webhook_server.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
